# Plantillas de serie de The Last System (PLANTILLAS.md §1.1).
# Qué crea cada plantilla, dónde, con qué nombre y qué pregunta al crear.
# `fichero`: dónde se instala en la carpeta ({direccion}, {ventas}… son las carpetas de área).
# `origen`: la original dentro de la app. `carpeta` y `nombre`: dónde nace la nota y cómo se llama.
# `carpeta_si`: carpeta según desde qué ficha se crea (la primera que haya gana).
# `serie`: contador de `.tls/secuencias.json` que da `{{numero}}`.

# Comunes (se instalan en 1 · Dirección/Sistemas/Plantillas/)
tarea:
  fichero: "{direccion}/Sistemas/Plantillas/Tarea.md"
  origen: "Comunes/Tarea.md"
  tipo: task
  carpeta: "{area}/Tareas"
  carpeta_si: {proyecto: "{{proyecto.carpeta}}/Tareas"}
  nombre: "t-{{numero:cifras}}-{{slug}}"
  preguntas: [titulo, responsable]
  desde: [project, opportunity, organization, contact]
  serie: tarea
  modulo: tareas
  sistemas: [todos]
